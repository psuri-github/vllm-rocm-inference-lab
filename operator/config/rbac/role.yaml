  - update
  - watch
- apiGroups:
  - inference.psuri-github.github.io
  resources:
  - vllmservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inference.psuri-github.github.io
  resources:
  - vllmservices/finalizers
  verbs:
  - update
- apiGroups:
  - inference.psuri-github.github.io
  resources:
  - vllmservices/status
  verbs:
  - get
  - patch
  - update
