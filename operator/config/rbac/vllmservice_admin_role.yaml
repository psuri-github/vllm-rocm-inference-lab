# This rule is not used by the project vllm-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over inference.psuri-github.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vllm-operator
    app.kubernetes.io/managed-by: kustomize
  name: vllmservice-admin-role
rules:
- apiGroups:
  - inference.psuri-github.github.io
  resources:
  - vllmservices
  verbs:
  - '*'
- apiGroups:
  - inference.psuri-github.github.io
  resources:
  - vllmservices/status
  verbs:
  - get
