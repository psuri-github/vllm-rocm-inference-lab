apiVersion: v1
kind: Pod
metadata:
  name: amd-gpu-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: amd-gpu-test
      image: ubuntu:24.04
      command:
        - sh
        - -c
      args:
        - |
          echo "Allocated AMD devices:"
          ls -l /dev/kfd /dev/dri
          sleep 600
      resources:
        limits:
          amd.com/gpu: 1
